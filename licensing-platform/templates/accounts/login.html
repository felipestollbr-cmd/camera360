{% extends "base.html" %}
{% block title %}Login - {{ brand_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:360px;margin:60px auto;">
    <h2>Entrar</h2>
    <form method="post">
        {% csrf_token %}
        <label>Usuário</label>
        <input type="text" name="username" required autofocus style="width:100%">
        <label>Senha</label>
        <input type="password" name="password" required style="width:100%">
        <button class="btn" type="submit" style="margin-top:16px;width:100%">Entrar</button>
    </form>
</div>
{% endblock %}
