services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: camera360_licensing
      POSTGRES_USER: camera360
      POSTGRES_PASSWORD: camera360
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - media:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_NAME: camera360_licensing
      DATABASE_USER: camera360
      DATABASE_PASSWORD: camera360
      DATABASE_HOST: db
      DATABASE_PORT: 5432
    depends_on:
      - db

volumes:
  pgdata:
  media:
