<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Camera360 - Nikon D800</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; overflow:hidden; font-family:-apple-system, 'Segoe UI', sans-serif; position:fixed; top:0; left:0; width:100%; height:100%; }
        .container { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; }
        .video-wrapper { flex:1; position:relative; background:#000; overflow:hidden; display:flex; justify-content:center; align-items:center; }
        img, canvas { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }
        canvas { pointer-events:none; z-index:10; }
        .controls { position:absolute; bottom:20px; left:0; right:0; display:flex; justify-content:center; gap:20px; z-index:20; }
        .btn { background:rgba(255,255,255,0.2); border:2px solid #fff; color:#fff; padding:12px 24px; border-radius:40px; font-size:16px; font-weight:600; cursor:pointer; backdrop-filter:blur(10px); transition:0.2s; }
        .btn:active { transform:scale(0.95); background:rgba(255,255,255,0.4); }
        .btn.capture { background:#ff3366; border-color:#ff3366; }
        .btn.video { background:#ff3b30; border-color:#ff3b30; }
    </style>
</head>
<body>
<div class="container">
    <div class="video-wrapper">
        <img id="videoFeed" src="/video_feed" alt="Live View">
        <canvas id="overlayCanvas"></canvas>
    </div>
    <div class="controls">
        <button class="btn" id="photoBtn">📷 Foto</button>
        <button class="btn capture" id="captureBtn">⏺️ Gravar</button>
        <button class="btn video" id="videoToggle">🎥 Vídeo</button>
    </div>
</div>
<script>
    (function() {
        const img = document.getElementById('videoFeed');
        const canvas = document.getElementById('overlayCanvas');
        const ctx = canvas.getContext('2d');
        const photoBtn = document.getElementById('photoBtn');
        const captureBtn = document.getElementById('captureBtn');
        const videoToggle = document.getElementById('videoToggle');

        let isRecording = false;
        let recordInterval = null;

        // Redimensiona o canvas para cobrir a imagem
        function resizeCanvas() {
            canvas.width = img.clientWidth || 800;
            canvas.height = img.clientHeight || 600;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Grade e régua serão desenhadas no servidor, não precisamos renderizar aqui.
        // Mas mantemos o canvas transparente.

        // --- Captura de foto ---
        photoBtn.addEventListener('click', async () => {
            const resp = await fetch('/capture', { method: 'POST' });
            const data = await resp.json();
            alert(data.success ? `Foto salva: ${data.filename}` : `Erro: ${data.error}`);
        });

        // --- Gravação de vídeo ---
        captureBtn.addEventListener('click', async () => {
            if (isRecording) {
                // Para gravação
                clearInterval(recordInterval);
                const resp = await fetch('/stop_recording', { method: 'POST' });
                const data = await resp.json();
                alert(data.success ? `Vídeo salvo: ${data.filename}` : `Erro: ${data.error}`);
                isRecording = false;
                captureBtn.textContent = '⏺️ Gravar';
                captureBtn.style.background = '#ff3366';
            } else {
                const resp = await fetch('/start_recording', { method: 'POST' });
                const data = await resp.json();
                if (data.success) {
                    isRecording = true;
                    captureBtn.textContent = '⏹️ Parar';
                    captureBtn.style.background = '#ff3b30';
                    // Envia frames a cada 100ms
                    recordInterval = setInterval(async () => {
                        await fetch('/record_frame', { method: 'POST' });
                    }, 100);
                } else {
                    alert(`Erro: ${data.error}`);
                }
            }
        });

        // --- Alternar modo (vídeo/foto) - apenas visual ---
        videoToggle.addEventListener('click', () => {
            alert('Modo vídeo ativado (use o botão central para gravar)');
        });
    })();
</script>
</body>
</html>
